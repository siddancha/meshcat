<!DOCTYPE html>
<html>

<head>
    <meta charset=utf-8>
    <title>MeshCat - InstancedMesh</title>
</head>

<body>
    <div id="meshcat-pane">
    </div>

    <script src="../dist/main.min.js"></script>
<script>

var viewer = new MeshCat.Viewer(document.getElementById("meshcat-pane"));

const THREE = MeshCat.THREE;
const orbitControls = viewer.controls;
const scene = viewer.scene;
const camera = viewer.camera;
const renderer = viewer.renderer;

// Create a cylinder and apply DragControls
const cylinder_length = 0.5;
const cylinder_radius = 0.2;
const geometry = new THREE.CylinderGeometry(
	cylinder_radius, cylinder_radius, cylinder_length, 32,
);
const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
const cylinder = new THREE.Mesh(geometry, material);
cylinder.position.set(0, 0, cylinder_length / 2);
// Rotate the cylinder to be upright along the z-axis
cylinder.rotation.x = Math.PI / 2;
scene.add(cylinder);

// Define a custom drag plane normal (in this case, restricting movement to the XY plane)
const dragPlaneNormal = new THREE.Vector3(0, 0, 1);

// Initialize DragControls.
const dragControls = new MeshCat.DragControls(
	cylinder,
	camera,
	orbitControls,
	dragPlaneNormal,
	renderer.domElement,
);
dragControls.addEventListener('drag', (event) => {
	renderer.render(scene, camera);
});

// Add hover event listeners for visual feedback
dragControls.addEventListener('hoveron', (event) => {
	// Set emissive color to create a subtle glow effect when hovering
	event.object.material.emissive.setScalar(0.2);
	renderer.render(scene, camera);
});

dragControls.addEventListener('hoveroff', (event) => {
	// Reset emissive color when not hovering
	event.object.material.emissive.setScalar(0.0);
	renderer.render(scene, camera);
});

// Add drag event listeners for enhanced visual feedback
// dragControls.addEventListener('dragstart', (event) => {
// 	// Set emissive color to full intensity when dragging
// 	event.object.material.emissive.setHex(0xaaaaaa);
// 	renderer.render(scene, camera);
// });

// dragControls.addEventListener('dragend', (event) => {
// 	// Return to hover intensity if still hovering
// 	event.object.material.emissive.setHex(0x555555);
// 	renderer.render(scene, camera);
// });

</script>

    <style>
        body {
            margin: 0;
        }

        #meshcat-pane {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #test-message {
            width: 75vw;
            text-align: left;
            background-color: rgb(232, 232, 232);
            position: fixed;
            left: 0%;
            display: block;
            padding: 10px;
        }

        #status-message {
            font-size: large;
            font-weight: bold;
        }
    </style>
</body>

</html>
