<!DOCTYPE html>
<html>

<head>
    <meta charset=utf-8>
    <title>MeshCat - InstancedMesh</title>
</head>

<body>
    <div id="meshcat-pane">
    </div>

    <script src="../dist/main.min.js"></script>
<script>

var viewer = new MeshCat.Viewer(document.getElementById("meshcat-pane"));

const THREE = MeshCat.THREE;
const orbitControls = viewer.controls;
const scene = viewer.scene;
const camera = viewer.camera;
const renderer = viewer.renderer;

const _plane = new THREE.Plane();

const _pointer = new THREE.Vector2();
const _offset = new THREE.Vector3();
const _diff = new THREE.Vector2();
const _previousPointer = new THREE.Vector2();
const _intersection = new THREE.Vector3();
const _worldPosition = new THREE.Vector3();
const _inverseMatrix = new THREE.Matrix4();

const _up = new THREE.Vector3();
const _right = new THREE.Vector3();

let _selected = null, _hovered = null;
const _intersections = [];

const STATE = {
	NONE: - 1,
	PAN: 0,
	ROTATE: 1
};

class DragControls extends THREE.Controls {

	constructor( object, camera, orbitControls = null, dragPlaneNormal = null, domElement = null ) {

		super( camera, domElement );

		this.object = object;
		this.camera = camera;

		this.orbitControls = orbitControls;
		this.recursive = true;
		this.transformGroup = false;
		this.rotateSpeed = 1;

		// Convert dragPlaneNormal from MeshCat's Z-up to Three.js's Y-up convention
		if (dragPlaneNormal) {
			// Create a copy of the vector
			const meshcatNormal = new THREE.Vector3().copy(dragPlaneNormal).normalize();
			
			// Convert from Z-up to Y-up (swap Y and Z components)
			this.dragPlaneNormal = new THREE.Vector3(
				meshcatNormal.x,
				meshcatNormal.z,  // Z in MeshCat becomes Y in Three.js
				-meshcatNormal.y  // Y in MeshCat becomes -Z in Three.js
			);
		} else {
			this.dragPlaneNormal = null;
		}

		this.raycaster = new THREE.Raycaster();

		// interaction

        this.mouseButtons = {
            LEFT: THREE.MOUSE.PAN,
            MIDDLE: THREE.MOUSE.PAN,

			// Commenting the next line to remove the functionality to rotate
			// the object.
            // RIGHT: THREE.MOUSE.ROTATE,
        };
		this.touches = { ONE: THREE.TOUCH.PAN };

		// event listeners

		this._onPointerMove = onPointerMove.bind( this );
		this._onPointerDown = onPointerDown.bind( this );
		this._onPointerCancel = onPointerCancel.bind( this );
		this._onContextMenu = onContextMenu.bind( this );

		//

		if ( domElement !== null ) {

			this.connect();

		}

	}

	connect() {

		this.domElement.addEventListener( 'pointermove', this._onPointerMove );
		this.domElement.addEventListener( 'pointerdown', this._onPointerDown );
		this.domElement.addEventListener( 'pointerup', this._onPointerCancel );
		this.domElement.addEventListener( 'pointerleave', this._onPointerCancel );
		this.domElement.addEventListener( 'contextmenu', this._onContextMenu );

		this.domElement.style.touchAction = 'none'; // disable touch scroll

	}

	disconnect() {

		this.domElement.removeEventListener( 'pointermove', this._onPointerMove );
		this.domElement.removeEventListener( 'pointerdown', this._onPointerDown );
		this.domElement.removeEventListener( 'pointerup', this._onPointerCancel );
		this.domElement.removeEventListener( 'pointerleave', this._onPointerCancel );
		this.domElement.removeEventListener( 'contextmenu', this._onContextMenu );

		this.domElement.style.touchAction = 'auto';
		this.domElement.style.cursor = '';

	}

	dispose() {

		this.disconnect();

	}

	_updatePointer( event ) {

		const rect = this.domElement.getBoundingClientRect();

		_pointer.x = ( event.clientX - rect.left ) / rect.width * 2 - 1;
		_pointer.y = - ( event.clientY - rect.top ) / rect.height * 2 + 1;

	}

	_updateState( event ) {

		// determine action

		let action;

		if ( event.pointerType === 'touch' ) {

			action = this.touches.ONE;

		} else {

			switch ( event.button ) {

				case 0:

					action = this.mouseButtons.LEFT;
					break;

				case 1:

					action = this.mouseButtons.MIDDLE;
					break;

				case 2:

					action = this.mouseButtons.RIGHT;
					break;

				default:

					action = null;

			}

		}

		// determine state

		switch ( action ) {

			case THREE.MOUSE.PAN:
			case THREE.TOUCH.PAN:

				this.state = STATE.PAN;

				break;

			case THREE.MOUSE.ROTATE:
			case THREE.TOUCH.ROTATE:

				this.state = STATE.ROTATE;

				break;

			default:

				this.state = STATE.NONE;

		}

	}

}

function onPointerMove( event ) {

	const camera = this.camera;
	const domElement = this.domElement;
	const raycaster = this.raycaster;

	if ( this.enabled === false ) return;

	this._updatePointer( event );

	raycaster.setFromCamera( _pointer, camera );

	if ( _selected ) {

		if ( this.state === STATE.PAN ) {

			if ( raycaster.ray.intersectPlane( _plane, _intersection ) ) {

				_selected.position.copy( _intersection.sub( _offset ).applyMatrix4( _inverseMatrix ) );

			}

		} else if ( this.state === STATE.ROTATE ) {

			_diff.subVectors( _pointer, _previousPointer ).multiplyScalar( this.rotateSpeed );
			_selected.rotateOnWorldAxis( _up, _diff.x );
			_selected.rotateOnWorldAxis( _right.normalize(), - _diff.y );

		}

		this.dispatchEvent( { type: 'drag', object: _selected } );

		_previousPointer.copy( _pointer );

	} else {

		// hover support

		if ( event.pointerType === 'mouse' || event.pointerType === 'pen' ) {

			_intersections.length = 0;

			raycaster.setFromCamera( _pointer, camera );
			raycaster.intersectObject( this.object, this.recursive, _intersections );

			if ( _intersections.length > 0 ) {

				const object = _intersections[ 0 ].object;

				// Use custom drag plane normal if available, otherwise use camera direction
				if (this.dragPlaneNormal) {
					_plane.setFromNormalAndCoplanarPoint(
						this.dragPlaneNormal,
						_worldPosition.setFromMatrixPosition(object.matrixWorld)
					);
				} else {
					_plane.setFromNormalAndCoplanarPoint(
						camera.getWorldDirection(_plane.normal),
						_worldPosition.setFromMatrixPosition(object.matrixWorld)
					);
				}

				if ( _hovered !== object && _hovered !== null ) {

					this.dispatchEvent( { type: 'hoveroff', object: _hovered } );

					domElement.style.cursor = 'auto';
					_hovered = null;

				}

				if ( _hovered !== object ) {

					this.dispatchEvent( { type: 'hoveron', object: object } );

					domElement.style.cursor = 'pointer';
					_hovered = object;

				}

			} else {

				if ( _hovered !== null ) {

					this.dispatchEvent( { type: 'hoveroff', object: _hovered } );

					domElement.style.cursor = 'auto';
					_hovered = null;

				}

			}

		}

	}

	_previousPointer.copy( _pointer );

}

function onPointerDown( event ) {

	const camera = this.camera;
	const domElement = this.domElement;
	const raycaster = this.raycaster;
	const orbitControls = this.orbitControls;

	if ( this.enabled === false ) return;

	this._updatePointer( event );
	this._updateState( event );

	_intersections.length = 0;

	raycaster.setFromCamera( _pointer, camera );
	raycaster.intersectObject( this.object, this.recursive, _intersections );

	if ( _intersections.length > 0 ) {

		if ( this.transformGroup === true ) {

			// look for the outermost group in the object's upper hierarchy

			_selected = findGroup( _intersections[ 0 ].object );

		} else {

			_selected = _intersections[ 0 ].object;

		}

		// Use custom drag plane normal if available, otherwise use camera direction
		if (this.dragPlaneNormal) {
			_plane.setFromNormalAndCoplanarPoint(
				this.dragPlaneNormal,
				_worldPosition.setFromMatrixPosition(_selected.matrixWorld)
			);
		} else {
			_plane.setFromNormalAndCoplanarPoint(
				camera.getWorldDirection(_plane.normal),
				_worldPosition.setFromMatrixPosition(_selected.matrixWorld)
			);
		}

		if ( raycaster.ray.intersectPlane( _plane, _intersection ) ) {

			if ( this.state === STATE.PAN ) {

				_inverseMatrix.copy( _selected.parent.matrixWorld ).invert();
				_offset.copy( _intersection ).sub( _worldPosition.setFromMatrixPosition( _selected.matrixWorld ) );

			} else if ( this.state === STATE.ROTATE ) {

				// the controls only support Y+ up
				_up.set( 0, 1, 0 ).applyQuaternion( camera.quaternion ).normalize();
				_right.set( 1, 0, 0 ).applyQuaternion( camera.quaternion ).normalize();

			}

		}

		domElement.style.cursor = 'move';

		// Disable orbit controls when dragging starts
		if (orbitControls) {
			orbitControls.enabled = false;
		}

		this.dispatchEvent( { type: 'dragstart', object: _selected } );

	}

	_previousPointer.copy( _pointer );

}

function onPointerCancel() {

	const orbitControls = this.orbitControls;

	if ( this.enabled === false ) return;

	if ( _selected ) {

		this.dispatchEvent( { type: 'dragend', object: _selected } );

		_selected = null;

	}

	this.domElement.style.cursor = _hovered ? 'pointer' : 'auto';

	// Re-enable orbit controls when dragging ends
	if (orbitControls) {
		orbitControls.enabled = true;
	}

	this.state = STATE.NONE;

}

function onContextMenu( event ) {

	if ( this.enabled === false ) return;

	event.preventDefault();

}

function findGroup( obj, group = null ) {

	if ( obj.isGroup ) group = obj;

	if ( obj.parent === null ) return group;

	return findGroup( obj.parent, group );

}

// Create a cylinder and apply DragControls
const cylinder_length = 0.5;
const cylinder_radius = 0.2;
const geometry = new THREE.CylinderGeometry(
	cylinder_radius, cylinder_radius, cylinder_length, 32,
);
const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
const cylinder = new THREE.Mesh(geometry, material);
cylinder.position.set(0, 0, cylinder_length / 2);
// Rotate the cylinder to be upright along the z-axis
cylinder.rotation.x = Math.PI / 2;
scene.add(cylinder);

// Define a custom drag plane normal (in this case, restricting movement to the XY plane)
const dragPlaneNormal = new THREE.Vector3(0, 0, 1);

// Initialize DragControls.
const dragControls = new DragControls(
	cylinder,
	camera,
	orbitControls,
	dragPlaneNormal,
	renderer.domElement,
);
dragControls.addEventListener('drag', (event) => {
	renderer.render(scene, camera);
});

// Add hover event listeners for visual feedback
dragControls.addEventListener('hoveron', (event) => {
	// Set emissive color to create a subtle glow effect when hovering
	event.object.material.emissive.setScalar(0.2);
	renderer.render(scene, camera);
});

dragControls.addEventListener('hoveroff', (event) => {
	// Reset emissive color when not hovering
	event.object.material.emissive.setScalar(0.0);
	renderer.render(scene, camera);
});

// Add drag event listeners for enhanced visual feedback
// dragControls.addEventListener('dragstart', (event) => {

// 	renderer.render(scene, camera);

// 	renderer.render(scene, camera);
// });

</script>

    <style>
        body {
            margin: 0;
        }

        #meshcat-pane {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #test-message {
            width: 75vw;
            text-align: left;
            background-color: rgb(232, 232, 232);
            position: fixed;
            left: 0%;
            display: block;
            padding: 10px;
        }

        #status-message {
            font-size: large;
            font-weight: bold;
        }
    </style>
</body>

</html>
