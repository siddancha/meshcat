<!DOCTYPE html>
<html>

<head>
    <meta charset=utf-8>
    <title>MeshCat - Mouse teleop</title>
</head>

<body>
    <div id="meshcat-pane">
    </div>

    <script src="../dist/main.min.js"></script>
    <!-- <script src="./interactiveShape_files/three.min.96.js"></script>
    <script src="./interactiveShape_files/OrbitControls.js"></script> -->
    <script>

// @author prisoner849

var viewer = new MeshCat.Viewer(document.getElementById("meshcat-pane"));

const THREE = MeshCat.THREE;
const controls = viewer.controls;
const scene = viewer.scene;
const camera = viewer.camera;
const renderer = viewer.renderer;

// var scene = new THREE.Scene();
// var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
// camera.position.set(0, 10, 10);
// var renderer = new THREE.WebGLRenderer({antialias: true});
// renderer.setSize(window.innerWidth, window.innerHeight);
// renderer.setClearColor(0x606060);
// document.body.appendChild(renderer.domElement);

// var controls = new THREE.OrbitControls(camera, renderer.domElement);

// var dirLight = new THREE.DirectionalLight(0xffffff, .75);
// dirLight.position.setScalar(10);
// scene.add(dirLight);
// scene.add(new THREE.AmbientLight(0x404040));

// scene.add(new THREE.GridHelper(20, 20, 0x404040, 0x404040));

var plane = new THREE.Plane();
plane.setFromCoplanarPoints(
  new THREE.Vector3(0, 0, 0), 
  new THREE.Vector3(1, 0, 0), 
  new THREE.Vector3(0, 1, 0)
);

var controlPoints = [];
controlPoints.push(createPoint(new THREE.Vector3(-5, 0,  0), "white"));
controlPoints.push(createPoint(new THREE.Vector3( 5, 5,  0), "white"));
controlPoints.push(createPoint(new THREE.Vector3( 0, -5,  0), "white"));
controlPoints.push(createPoint(new THREE.Vector3( 0, 0,  0), "white"));

function createPoint(position, color){
  var viewGeometry = new THREE.BoxGeometry(.5, .5, 1.55, 1, 1, 3);
  viewGeometry.translate(0, 0, .75);
  var viewMaterial = new THREE.MeshBasicMaterial({color: color, wireframe: false, transparent: true, opacity: .5});
  var view = new THREE.Mesh(viewGeometry, viewMaterial);
  view.position.copy(position);
  scene.add(view);
  return view;
}

function createCurveGeometry(){
  var pts = [];
  controlPoints.forEach(pt => {
    pts.push(pt.position);
  });
  var curve = new THREE.CatmullRomCurve3( pts );
  curve.closed = true;
  
  // Get points from the curve
  const curvePoints = curve.getPoints(75);
  
  // Create a buffer geometry
  const curveGeometry = new THREE.BufferGeometry();
  
  // Create position attribute from the points
  const positions = new Float32Array(curvePoints.length * 3);
  
  curvePoints.forEach((point, i) => {
    positions[i * 3] = point.x;
    positions[i * 3 + 1] = point.y;
    positions[i * 3 + 2] = point.z;
  });
  
  // Set the position attribute
  curveGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  curveGeometry.translate(0, 0, 1);  // so that white line is on top of the extruded shape
  return curveGeometry;
}
var curveMaterial = new THREE.LineBasicMaterial({color: "white"});
var curveLine = new THREE.Line(createCurveGeometry(), curveMaterial);
scene.add(curveLine);

var extrudeSettings = { amount: 1, bevelEnabled: false};
var points = [];
var shape = null;
var shapeGeometry;
var shapeMaterial = [
  new THREE.MeshLambertMaterial({color:0xb5b5b5}),
  new THREE.MeshLambertMaterial({color:"aqua"})
]
var shapeMesh = new THREE.Mesh(shapeGeometry, shapeMaterial);
scene.add(shapeMesh);

// Initialize points array
const positions = curveLine.geometry.attributes.position;
const count = positions.count;
for (let i = 0; i < count; i++) {
  const x = positions.getX(i);
  const y = positions.getY(i);
  points.push(new THREE.Vector2(x, y));
}

function extrudeMesh(){
  // Get the curve points from the buffer geometry
  const positions = curveLine.geometry.attributes.position;
  const count = positions.count;
  
  // Clear the points array and refill it
  points.length = 0;
  for (let i = 0; i < count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    points.push(new THREE.Vector2(x, y));
  }
  
  shape = new THREE.Shape(points);
  shapeGeometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  // shapeGeometry.rotateZ(Math.PI * .5);
  // shapeGeometry.translate(0, 0, 1);


  shapeMesh.geometry.dispose();
  shapeMesh.geometry = shapeGeometry;
}
extrudeMesh();

window.addEventListener("mousedown", onMouseDown, false);
window.addEventListener("mouseup", onMouseUp, false);
window.addEventListener("mousemove", onMouseMove, false);

var raycaster = new THREE.Raycaster();
var mouse = new THREE.Vector2();
var intersects;
var dragging = false;
var dragObject;
var planeNormal = new THREE.Vector3(0, 0, 1);
var shift = new THREE.Vector3();

function onMouseDown(event){
  intersects = raycaster.intersectObjects(controlPoints);
	if (intersects.length > 0){
  	controls.enableRotate = false;
    dragObject = intersects[0].object;
    plane.setFromNormalAndCoplanarPoint(planeNormal, intersects[0].point);
    shift.subVectors(dragObject.position, intersects[0].point);
    dragging = true;
  }
}

function onMouseUp(event){
  controls.enableRotate = true;
  dragObject = null;
  dragging = false;
}

function onMouseMove(event){
  mouse.x = ( event.clientX / window.innerWidth ) * 2 - 1;
  mouse.y = - ( event.clientY / window.innerHeight ) * 2 + 1;
  if (intersects == null || intersects.length == 0 || !dragging) return;
  const pointOfIntersection = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane, pointOfIntersection);
  dragObject.position.copy(pointOfIntersection).add(shift);
  curveLine.geometry.dispose();
  curveLine.geometry = createCurveGeometry();
  extrudeMesh();
}

var time = 0;
var curShift = 0;
render();
function render(){
  time = Date.now() * 0.001;
  requestAnimationFrame(render);
  raycaster.setFromCamera(mouse, camera);
  controlPoints.forEach((cp, idx) => {
    curShift = (Math.PI / 2) * idx;
    cp.material.opacity = 0.6 + Math.sin(time - curShift) * .2;
  });
  renderer.render(scene, camera);
}
</script>

<style>
  body {
      margin: 0;
  }

  #meshcat-pane {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
  }
</style>

</body>
</html>
